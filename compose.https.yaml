services:
  api:
    # Only nginx publishes HTTP(S) in this deployment mode.
    ports: !reset []
    environment:
      ALLOWED_ORIGINS: ${HTTPS_ALLOWED_ORIGINS:?set by deploy-https.sh}

  nginx:
    image: nginx:stable-alpine
    depends_on:
      api: {condition: service_healthy}
    environment:
      NGINX_ENVSUBST_FILTER: HTTPS_REDIRECT_PORT
      HTTPS_REDIRECT_PORT: ${HTTPS_REDIRECT_PORT:-}
    ports:
      - "${HTTPS_BIND_HOST:-0.0.0.0}:${HTTPS_HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_HOST:-0.0.0.0}:${HTTPS_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./.https/certs:/etc/nginx/tls:ro
      - ./.https/challenges:/var/www/acme:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.4.0
    profiles: [certbot]
    volumes:
      - ./.https/challenges:/var/www/acme
      - ./.https/letsencrypt:/etc/letsencrypt
